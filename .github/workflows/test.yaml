on:
  push:
    branches:
      - master
      - v1
  pull_request:
    branches:
      - "**"
name: Tests
jobs:
  tests:
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - run: make ci
